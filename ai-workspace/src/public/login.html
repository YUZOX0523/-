<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | AIワークスペース</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>🤝 AIワークスペース</h1>
      <p class="sub">会社のAIアシスタントにログインします</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" autocomplete="username" required placeholder="例：tanaka@kaisha.co.jp">
        </div>
        <div class="field">
          <label for="password">パスワード</label>
          <input type="password" id="password" autocomplete="current-password" required
                 autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:.95rem;cursor:pointer">
          <input type="checkbox" id="showPw" style="width:20px;height:20px"> 入力した文字を表示する
        </label>
        <button type="submit" class="btn-primary" id="loginBtn">ログインする</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
