# Render (https://render.com) にブラウザ操作だけでデプロイするための設定
#
# 手順:
#   1. https://render.com にGitHubアカウントでサインアップ（無料）
#   2. New + → Blueprint → このリポジトリを選択
#   3. 環境変数3つ（APIキー・管理者メール・管理者パスワード）を入力 → Apply
#   4. 数分で https://xxxx.onrender.com のURLが発行される
#
# 注意: 無料プランはディスクが永続化されないため、再デプロイでデータが消えます（デモ用途向け）。
#       本番はVPSまたはRender有料プラン＋Persistent Diskを使ってください。
services:
  - type: web
    name: digirise-ai-workspace
    runtime: node
    rootDir: ai-workspace
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_MONTHLY_BUDGET_JPY
        value: "500"
